<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pago de licencia · VETEX</title>
<style>
:root{--bg:#F5F3FA;--card:#fff;--fg:#1A1530;--mu:#625A7A;--line:#DCD6EA;--ac:#6C3BE4;--ok:#1C7A3F;--okbg:#DDF1E3;--bad:#B3261E;--badbg:#F8E0DE;--wa:#A44C08;--wabg:#FBEADB}
@media (prefers-color-scheme:dark){:root{--bg:#110D1C;--card:#1A1529;--fg:#ECE8F7;--mu:#A79FC0;--line:#2F2745;--ac:#A78BFA;--ok:#6FD394;--okbg:#173A24;--bad:#F08A80;--badbg:#3D1C19;--wa:#F0A35E;--wabg:#3A2614}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;max-width:420px;width:100%;text-align:center;display:grid;gap:12px}
.lg{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;letter-spacing:.14em}
.lg svg{width:34px;height:34px}
.ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:4px auto;font-size:32px}
.ok .ic{background:var(--okbg);color:var(--ok)}.bad .ic{background:var(--badbg);color:var(--bad)}.wait .ic{background:var(--wabg);color:var(--wa)}
h1{font-size:22px;margin:0}p{margin:0;color:var(--mu)}b{color:var(--fg)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 16px;cursor:pointer}
.sp{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:g 1s linear infinite;margin:auto}@keyframes g{to{transform:rotate(360deg)}}
</style></head><body>
<main class="c" id="c" aria-live="polite">
  <div class="lg"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#6C3BE4"/><path d="M152 178 L244 346 L364 156" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/></svg>VETEX</div>
  <div class="sp"></div><p>Revisando tu pago…</p>
</main>
<script>
const c=document.getElementById('c'),id=new URLSearchParams(location.search).get('id')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const head=c.querySelector('.lg').outerHTML;
const fecha=v=>{try{return new Date(v+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})}catch{return v}};
function show(k,ic,t,m,btn){c.className='c '+k;c.innerHTML=head+`<div class="ic">${ic}</div><h1>${t}</h1><p>${m}</p>`+(btn?`<button id="b">${btn}</button>`:'');const b=document.getElementById('b');if(b)b.onclick=()=>{intentos=0;revisar()}}
let intentos=0;
async function revisar(){
  if(!id){show('bad','!','No encontramos el pago','Vuelve a VETEX y revisa la licencia.');return}
  try{const r=await fetch('/api/pago/confirmar?id='+encodeURIComponent(id),{cache:'no-store'});const j=await r.json();
    if(j.ok&&j.estado==='aprobado'){show('ok','✓','¡Pago recibido!',`La licencia${j.negocio?' de <b>'+esc(j.negocio)+'</b>':''} quedó al día hasta el <b>${esc(fecha(j.vence))}</b>.<br><br>Ya puedes cerrar esta ventana y volver a VETEX: se actualiza solo en unos segundos.`);return}
    if(['declined','voided','error'].includes(j.estado)){show('bad','✕','El pago no se aprobó','No se hizo ningún cobro. Vuelve a VETEX e inténtalo otra vez con otro medio de pago.');return}
    if(j.estado==='revisar'){show('wait','!','Estamos revisando tu pago','El valor no coincide con el plan. Tu proveedor de VETEX lo revisará y te confirmará.');return}
    if(++intentos<20){show('wait','…','Esperando la confirmación','Algunos medios (PSE, Nequi) tardan un momento. No cierres esta ventana.');setTimeout(revisar,4000);return}
    show('wait','…','El pago sigue en proceso','Cuando el banco lo confirme, VETEX se renueva solo. Puedes cerrar esta ventana.','Revisar otra vez');
  }catch(e){show('wait','!','Sin conexión','No pudimos revisar el pago ahora.','Intentar de nuevo')}
}
revisar();
</script></body></html>
